{% extends 'base.html' %}

{% block title %}
{{ data.title }} - BRT
{% endblock %}

{% block body %}
<div class="info-page">
    <div class="info-page__header">
        <div class="info-page__container">
            <a href="/" class="info-page__back">
                <img src="{{ url_for('static', filename='icons/arrow-short.svg') }}" alt="">
                На главную
            </a>
            <h1 class="info-page__title">{{ data.title }}</h1>
            <p class="info-page__subtitle">{% block subtitle %}BRT — Bahn Routing Tools{% endblock %}</p>
        </div>
    </div>
    
    <div class="info-page__content">
        <div class="info-page__container">
            {% block info_content %}{% endblock %}
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const header = document.getElementById('header');
    if (header) {
        header.classList.add('scrolled');
        header.style.boxShadow = 'none';
        const logoWhite = header.querySelector('.header__logo--white');
        const logoDark = header.querySelector('.header__logo--dark');
        if (logoWhite) logoWhite.style.display = 'none';
        if (logoDark) logoDark.style.display = 'block';
        const sepImg = header.querySelector('.lang-cur img');
        const supportImg = header.querySelector('.support-image');
        if (sepImg) sepImg.src = '/static/icons/v-line-18.png';
        if (supportImg) supportImg.src = '/static/icons/support.svg';
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                header.style.background = '#EFF1F4';
                header.style.boxShadow = '0 2px 20px rgba(0, 0, 0, 0.15)';
            } else {
                header.style.boxShadow = 'none';
            }
        });
    }
});
</script>
{% endblock %}
