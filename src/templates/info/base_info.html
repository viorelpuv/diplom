{% extends 'base.html' %}

{% block title %}
{{ data.title }} - BRT
{% endblock %}

{% block body %}
<div class="info-page">
    <div class="info-page__header">
        <div class="info-page__container">
            <a href="/" class="info-page__back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="#1E1E1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                На главную
            </a>
            <h1 class="info-page__title">{{ data.title }}</h1>
            <p class="info-page__subtitle">{% block subtitle %}BRT — Bahn Routing Tools{% endblock %}</p>
        </div>
    </div>
    
    <div class="info-page__content">
        <div class="info-page__container">
            {% block info_content %}{% endblock %}
        </div>
    </div>
</div>

{% endblock %}
